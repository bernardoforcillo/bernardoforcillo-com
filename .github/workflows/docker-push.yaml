name: 'build containers and push to dockerhub'
# Disabled as an automatic trigger: bernardoforcillo.com is served by Cloudflare
# Workers now, deployed by Workers Builds rather than by any workflow in here.
# Nothing has been removed - the Dockerfile, the Go server and the Kubernetes
# manifests are all still in the repository and still checked by verify.yaml -
# but the image is no longer what production runs, so building and pushing it on
# every commit would publish an artefact nobody deploys. Start it from the
# Actions tab when an image is actually wanted.
on:
  workflow_dispatch:
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            bernardoforcillo/bernardoforcillo-com
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=bernardoforcillo-com
            org.opencontainers.image.description=This container image contains the Bernardo Forcillo's personal website. See https://bernardoforcillo.com/
            org.opencontainers.image.vendor=Bernardo Forcillo
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/www/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
